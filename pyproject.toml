[tool.isort]
profile = "black"
line_length = 100
known_first_party = [
    "nbanalytic",
    "numbat",
    "numtools"
]
src_paths = ["backend"]

[tool.ruff]
line-length = 100
src = ["backend"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
split-on-trailing-comma = true
known-first-party = [
    "nbanalytic",
    "numbat_core",
    "numbat",
    "numtools"
]

[tool.black]
line-length = 100

[tool.pyright]
typeCheckingMode = "off"
reportAttributeAccessIssue = "none"
extraPaths = ["backend", "backend/fortran", "backend/fortran/include"]
